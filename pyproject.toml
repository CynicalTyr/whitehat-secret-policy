[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whitehat-secret-policy"
version = "0.1.0"
description = "White-hat leak-finder policy: validated vs candidate, never auto-disclose."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CynicalTyr" }]
keywords = ["ai-agents", "llm", "edge"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = []
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/CynicalTyr/whitehat-secret-policy"
Issues = "https://github.com/CynicalTyr/whitehat-secret-policy/issues"

[tool.setuptools]
py-modules = ["review_gate"]
