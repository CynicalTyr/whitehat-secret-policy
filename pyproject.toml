[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whitehat-secret-policy"
version = "0.1.0"
description = "Review enqueue only when a secret is validated. Candidates stay masked; never auto-disclose to Slack."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CynicalTyr" }]
keywords = ["secret-scanning", "alert-fatigue", "white-hat", "policy", "ai-agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/CynicalTyr/whitehat-secret-policy"
Issues = "https://github.com/CynicalTyr/whitehat-secret-policy/issues"

[tool.setuptools]
py-modules = ["review_gate"]
